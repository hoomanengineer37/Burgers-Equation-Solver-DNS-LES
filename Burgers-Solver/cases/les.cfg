# Large eddy simulation of Burgers' equation with a Smagorinsky-type model.
# Run from the repository root:  ./build/burgers --config cases/les.cfg

model        = les
nu           = 0.001     # Re = 1/nu = 1000
Cs           = 0.3       # Smagorinsky constant
t_final      = 1.0
n_points     = 1601
n_outputs    = 30
output_dir   = results/les_nu0.001
