# Direct numerical simulation of Burgers' equation, u(x,0) = sin(pi x).
# Run from the repository root:  ./build/burgers --config cases/dns.cfg

model        = dns
nu           = 0.001     # Re = 1/nu = 1000
t_final      = 1.0
n_points     = 1601
filter_width = 4         # filtered DNS is written for comparison with LES
n_outputs    = 30
output_dir   = results/dns_nu0.001
